name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/hnindex-cli/package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  check-vibe-hnindex:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check vibe-hnindex version vs npm
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view vibe-hnindex version 2>/dev/null || echo "0.0.0")
          echo "vibe-hnindex local=$LOCAL_VERSION npm=$NPM_VERSION"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  check-hnindex-cli:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check hnindex-cli version vs npm
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/hnindex-cli/package.json').version")
          NPM_VERSION=$(npm view hnindex-cli version 2>/dev/null || echo "0.0.0")
          echo "hnindex-cli local=$LOCAL_VERSION npm=$NPM_VERSION"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish-vibe-hnindex:
    needs: check-vibe-hnindex
    if: needs.check-vibe-hnindex.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish vibe-hnindex to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-vibe-hnindex.outputs.version }}
          name: v${{ needs.check-vibe-hnindex.outputs.version }}
          body: |
            ## vibe-hnindex v${{ needs.check-vibe-hnindex.outputs.version }}

            Published to npm: [`vibe-hnindex@${{ needs.check-vibe-hnindex.outputs.version }}`](https://www.npmjs.com/package/vibe-hnindex)

            Optional CLI installer: [`hnindex-cli`](https://www.npmjs.com/package/hnindex-cli) (`npm install -g hnindex-cli`)

            ```bash
            npx -y vibe-hnindex
            ```
          generate_release_notes: true

  publish-hnindex-cli:
    needs: check-hnindex-cli
    if: needs.check-hnindex-cli.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish hnindex-cli to npm
        run: npm publish -w hnindex-cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
