name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/hnindex-cli/package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  check-versions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server_publish: ${{ steps.check.outputs.server_publish }}
      cli_publish: ${{ steps.check.outputs.cli_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check exact package versions on npm
        id: check
        run: node scripts/check-npm-release.mjs

  publish-vibe-hnindex:
    needs: [validate, check-versions]
    if: needs.check-versions.outputs.server_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Publish server
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-hnindex-cli:
    needs: [validate, check-versions]
    if: needs.check-versions.outputs.cli_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Publish CLI
        run: npm publish -w hnindex-cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    needs: [validate, check-versions, publish-vibe-hnindex, publish-hnindex-cli]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      needs.check-versions.result == 'success' &&
      (needs.publish-vibe-hnindex.result == 'success' || needs.publish-vibe-hnindex.result == 'skipped') &&
      (needs.publish-hnindex-cli.result == 'success' || needs.publish-hnindex-cli.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-versions.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create annotated version tag
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.check-versions.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-versions.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-versions.outputs.version }}
          body: |
            Published packages:
            - [vibe-hnindex@${{ needs.check-versions.outputs.version }}](https://www.npmjs.com/package/vibe-hnindex/v/${{ needs.check-versions.outputs.version }})
            - [hnindex-cli@${{ needs.check-versions.outputs.version }}](https://www.npmjs.com/package/hnindex-cli/v/${{ needs.check-versions.outputs.version }})

            Claude Code marketplace:
            ```text
            /plugin marketplace add AndyAnh174/vibe-hnindex
            /plugin install vibe-hnindex@vibe-hnindex-marketplace
            ```

            Embedding providers: Ollama, OpenAI, Voyage, Gemini and OpenAI-compatible APIs.
            See [configuration](https://github.com/AndyAnh174/vibe-hnindex/blob/v${{ needs.check-versions.outputs.version }}/docs/embedding-providers.md).
            Code Graph and labeled retrieval evaluation: [guide](https://github.com/AndyAnh174/vibe-hnindex/blob/v${{ needs.check-versions.outputs.version }}/docs/code-graph.md).
          generate_release_notes: true
