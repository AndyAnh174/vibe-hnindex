<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="chunkerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="sqliteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="qdrantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <linearGradient id="depGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">vibe-hnindex Architecture</text>
  <text x="450" y="56" text-anchor="middle" fill="#64748b" font-size="12">v0.3.0 — Codebase Intelligence</text>

  <!-- AI Client Box -->
  <rect x="180" y="72" width="540" height="72" rx="12" fill="url(#clientGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AI Client</text>
  <text x="450" y="120" text-anchor="middle" fill="#e0e7ff" font-size="11">Claude  ·  Cursor  ·  Windsurf  ·  Antigravity</text>
  <text x="450" y="134" text-anchor="middle" fill="#c7d2fe" font-size="10">16 MCP tools available</text>

  <!-- JSON-RPC Arrow -->
  <line x1="450" y1="144" x2="450" y2="178" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="444,174 450,184 456,174" fill="#94a3b8"/>
  <rect x="390" y="154" width="120" height="20" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450" y="168" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">JSON-RPC (stdio)</text>

  <!-- MCP Server Box -->
  <rect x="40" y="188" width="820" height="510" rx="14" fill="url(#serverGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="214" fill="#e2e8f0" font-size="15" font-weight="700">vibe-hnindex</text>
  <text x="195" y="214" fill="#64748b" font-size="12">MCP Server</text>

  <!-- === INDEXING PIPELINE === -->
  <text x="60" y="248" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">INDEXING PIPELINE</text>
  <line x1="60" y1="254" x2="340" y2="254" stroke="#334155" stroke-width="1"/>

  <!-- File Scanner -->
  <rect x="60" y="268" width="160" height="64" rx="10" fill="url(#scannerGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="92" y="294" fill="#fff" font-size="20">&#128194;</text>
  <text x="118" y="296" fill="#fff" font-size="13" font-weight="600">File Scanner</text>
  <text x="140" y="314" text-anchor="middle" fill="#e0f2fe" font-size="9">Walk dirs · Detect lang</text>
  <text x="140" y="324" text-anchor="middle" fill="#e0f2fe" font-size="9">Skip binary · Symlinks</text>

  <!-- Arrow Scanner → Chunker -->
  <line x1="220" y1="300" x2="258" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="254,295 264,300 254,305" fill="#94a3b8"/>

  <!-- Chunker -->
  <rect x="265" y="268" width="160" height="64" rx="10" fill="url(#chunkerGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="297" y="294" fill="#fff" font-size="20">&#9998;</text>
  <text x="325" y="296" fill="#fff" font-size="13" font-weight="600">Chunker</text>
  <text x="345" y="314" text-anchor="middle" fill="#fef3c7" font-size="9">60 lines · Boundary-aware</text>
  <text x="345" y="324" text-anchor="middle" fill="#fef3c7" font-size="9">5-line overlap · SHA-256</text>

  <!-- Arrow Chunker → Ollama -->
  <line x1="425" y1="300" x2="463" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="459,295 469,300 459,305" fill="#94a3b8"/>

  <!-- Ollama Embeddings -->
  <rect x="470" y="268" width="170" height="64" rx="10" fill="url(#ollamaGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="502" y="294" fill="#fff" font-size="20">&#129504;</text>
  <text x="530" y="296" fill="#fff" font-size="13" font-weight="600">Ollama Embed</text>
  <text x="555" y="314" text-anchor="middle" fill="#d1fae5" font-size="9">bge-m3 · 1024-dim vectors</text>
  <text x="555" y="324" text-anchor="middle" fill="#d1fae5" font-size="9">Batch 32 · POST /api/embed</text>

  <!-- === NEW: DEPENDENCY PARSER === -->
  <rect x="680" y="268" width="160" height="64" rx="10" fill="url(#depGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="712" y="294" fill="#fff" font-size="20">&#128279;</text>
  <text x="740" y="296" fill="#fff" font-size="13" font-weight="600">Dep Parser</text>
  <text x="760" y="314" text-anchor="middle" fill="#f3e8ff" font-size="9">Import/Export regex</text>
  <text x="760" y="324" text-anchor="middle" fill="#f3e8ff" font-size="9">TS/JS/Py/Go/Rust/Java</text>

  <!-- Arrow from Chunker down to Dep Parser note -->
  <path d="M 345 332 L 345 350 L 760 350 L 760 332" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- === STORAGE LAYER === -->
  <text x="60" y="388" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">STORAGE LAYER</text>
  <line x1="60" y1="394" x2="340" y2="394" stroke="#334155" stroke-width="1"/>

  <!-- SQLite -->
  <rect x="60" y="408" width="240" height="100" rx="12" fill="url(#sqliteGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="92" y="438" fill="#fff" font-size="22">&#128451;</text>
  <text x="120" y="438" fill="#fff" font-size="15" font-weight="700">SQLite + FTS5</text>
  <text x="180" y="460" text-anchor="middle" fill="#dbeafe" font-size="10">chunks · projects · chunks_fts</text>
  <text x="180" y="476" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="600">dependencies · exports</text>
  <text x="180" y="492" text-anchor="middle" fill="#bfdbfe" font-size="9">BM25 ranking · Keyword search</text>

  <!-- Qdrant -->
  <rect x="340" y="408" width="240" height="100" rx="12" fill="url(#qdrantGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="372" y="438" fill="#fff" font-size="22">&#127919;</text>
  <text x="400" y="438" fill="#fff" font-size="15" font-weight="700">Qdrant Vectors</text>
  <text x="460" y="460" text-anchor="middle" fill="#fce7f3" font-size="10">1024-dim cosine similarity</text>
  <text x="460" y="476" text-anchor="middle" fill="#fce7f3" font-size="10">1 collection per project</text>
  <text x="460" y="492" text-anchor="middle" fill="#fbcfe8" font-size="9">Semantic search · Docker</text>

  <!-- Git Service -->
  <rect x="620" y="408" width="220" height="100" rx="12" fill="url(#gitGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="652" y="438" fill="#fff" font-size="22">&#128218;</text>
  <text x="686" y="438" fill="#fff" font-size="15" font-weight="700">Git Service</text>
  <text x="730" y="460" text-anchor="middle" fill="#fee2e2" font-size="10">Recent commits · File history</text>
  <text x="730" y="476" text-anchor="middle" fill="#fee2e2" font-size="10">child_process · No deps</text>
  <text x="730" y="492" text-anchor="middle" fill="#fecaca" font-size="9">Cross-reference with index</text>

  <!-- Arrows from pipeline to storage -->
  <line x1="140" y1="332" x2="140" y2="408" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="134,404 140,414 146,404" fill="#60a5fa"/>

  <line x1="345" y1="332" x2="345" y2="370" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="180" y1="370" x2="460" y2="370" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="370" x2="460" y2="408" stroke="#f472b6" stroke-width="2"/>
  <polygon points="454,404 460,414 466,404" fill="#f472b6"/>

  <!-- === TOOLS (16) === -->
  <text x="60" y="540" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">MCP TOOLS (16)</text>
  <line x1="60" y1="546" x2="340" y2="546" stroke="#334155" stroke-width="1"/>

  <!-- Tool chips - Row 1: Core -->
  <rect x="60" y="558" width="115" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="117" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">index_codebase</text>

  <rect x="182" y="558" width="85" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="224" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">index_file</text>

  <rect x="274" y="558" width="70" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="309" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">search</text>

  <rect x="351" y="558" width="95" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="398" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">list_projects</text>

  <rect x="453" y="558" width="105" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="505" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">delete_project</text>

  <rect x="565" y="558" width="92" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="611" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">get_file_info</text>

  <rect x="664" y="558" width="95" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="711" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">project_stats</text>

  <rect x="766" y="558" width="75" height="28" rx="14" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="803" y="576" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">watch</text>

  <!-- Tool chips - Row 2: v0.3.0 NEW -->
  <rect x="56" y="594" width="36" height="16" rx="8" fill="#7c3aed"/>
  <text x="74" y="605" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">NEW</text>

  <rect x="98" y="592" width="138" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="167" y="610" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">codebase_overview</text>

  <rect x="243" y="592" width="105" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="295" y="610" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">file_summary</text>

  <rect x="355" y="592" width="122" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="416" y="610" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">get_dependencies</text>

  <rect x="484" y="592" width="115" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="541" y="610" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">get_dependents</text>

  <!-- Row 3: more new tools -->
  <rect x="98" y="626" width="118" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="157" y="644" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">impact_analysis</text>

  <rect x="223" y="626" width="120" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="283" y="644" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">recent_changes</text>

  <rect x="350" y="626" width="112" height="28" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="406" y="644" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">smart_context</text>

  <!-- Legend -->
  <rect x="620" y="620" width="220" height="76" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="640" y="638" fill="#94a3b8" font-size="9" font-weight="600">SEARCH MODES</text>
  <circle cx="640" cy="652" r="4" fill="#3b82f6"/>
  <text x="650" y="656" fill="#94a3b8" font-size="10">Keyword (FTS5 + BM25)</text>
  <circle cx="640" cy="668" r="4" fill="#ec4899"/>
  <text x="650" y="672" fill="#94a3b8" font-size="10">Semantic (Vector cosine)</text>
  <circle cx="640" cy="684" r="4" fill="#a855f7"/>
  <text x="650" y="688" fill="#94a3b8" font-size="10">Hybrid (RRF fusion)</text>
</svg>
